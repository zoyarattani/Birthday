<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Zayaan!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            background: black;
            color: red;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
        }
        .container {
            padding: 100px 20px;
        }
        h1 {
            font-size: 60px;
            text-shadow: 3px 3px 15px red;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from {
                text-shadow: 3px 3px 15px red;
            }
            to {
                text-shadow: 3px 3px 30px white;
            }
        }
        .message {
            background: rgba(255, 0, 0, 0.2);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0px 0px 20px red;
            color: white;
        }
        .message p {
            font-size: 24px;
        }
        .image-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .image-container img {
            width: 350px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy 20th Birthday Zayaan!</h1>
        <div class="message">
            <p>May the Force be with you on your special day!</p>
            <p>Wishing you an adventure-filled birthday in a galaxy far, far away...</p>
        </div>
        <div class="image-container">
            <img src="image.png" alt="Darth Vader with Lightsaber">
        </div>
    </div>
</body>
</html>
