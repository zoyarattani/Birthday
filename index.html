<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Zayaan!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            background: url('galaxy.png') no-repeat center center fixed;
            background-size: cover;
            color: red;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            position: relative;
        }
        .container {
            padding: 100px 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            display: inline-block;
        }
        h1 {
            font-size: 60px;
            text-shadow: 3px 3px 15px red;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from {
                text-shadow: 3px 3px 15px red;
            }
            to {
                text-shadow: 3px 3px 30px white;
            }
        }
        .message {
            background: rgba(255, 0, 0, 0.2);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0px 0px 20px red;
            color: white;
        }
        .message p {
            font-size: 24px;
        }
        .image-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .image-container img {
            width: 350px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px red;
        }
        .character {
            position: absolute;
            width: 150px;
        }
        .character img {
            width: 150px;
            border-radius: 10px;
        }
        .speech-bubble {
            position: absolute;
            color: black;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 2px 2px 10px gray;
        }
        .left {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        .right {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy 20th Birthday Zayaan!</h1>
        <div class="message">
            <p>May the Force be with you on your special day!</p>
            <p>Wishing you an adventure-filled birthday in a galaxy far, far away...</p>
        </div>
        <div class="image-container">
            <img src="image.jpg" alt="Darth Vader with Lightsaber">
        </div>
    </div>
    
<!-- Star Wars Characters on the Sides -->
    <div class="character left">
        <img src="yoda.png" alt="Yoda">
        <div class="speech-bubble">Happy birthday, Zayaan, hmm! Celebrate, you must!</div>
    </div>
    <div class="character right">
        <img src="stormtrooper.png" alt="Stormtrooper">
        <div class="speech-bubble">Happy birthday, Zayaan! Orders are to celebrate… move along.</div>
    </div>
</body>
</html>
